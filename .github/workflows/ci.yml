name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            .swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}

      - name: Run verification
        run: ./scripts/verify.sh
